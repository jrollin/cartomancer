[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/jrollin/cartomancer"

[workspace.dependencies]
# Internal crates
cartomancer-core = { path = "crates/cartomancer-core", version = "0.8.0" }
cartomancer-graph = { path = "crates/cartomancer-graph", version = "0.8.0" }
cartomancer-github = { path = "crates/cartomancer-github", version = "0.8.0" }
cartomancer-store = { path = "crates/cartomancer-store", version = "0.8.0" }
cartomancer = { path = "crates/cartomancer-server", version = "0.8.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
hmac = "0.13"
sha2 = "0.11"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Code graph
# default-features off: only the local graph DB is used, and the default
# remote-s3 feature pulls rust-s3 -> quick-xml 0.38 (RUSTSEC-2026-0194/0195)
cartog = { version = "0.32", default-features = false }

# Async trait
async-trait = "0.1"

# Config
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# Testing
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = "debuginfo"

# opt-level=1 because tree-sitter C grammars (via cartog) compile slowly at default level=0
[profile.dev]
opt-level = 1
